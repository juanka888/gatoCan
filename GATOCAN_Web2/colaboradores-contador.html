<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de colaboradores · GatoCan</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="counter-page">
        <section class="card">
            <h1>Contador de clics por colaborador</h1>
            <p>Panel de prueba para ver cuántas pulsaciones recibe cada colaborador en el banner rotativo.</p>
            <table class="counter-table" aria-label="Clics por colaborador">
                <thead>
                    <tr>
                        <th>Colaborador</th>
                        <th>Clics</th>
                    </tr>
                </thead>
                <tbody id="counter-body"></tbody>
            </table>
            <div class="counter-actions">
                <a href="./index.html#inicio" class="btn btn-secondary">Volver al inicio</a>
                <button id="reset-counter" class="btn btn-primary" type="button">Reiniciar contador</button>
            </div>
        </section>
    </main>

    <script>
        const contadorKey = 'gatocanColaboradoresClicks';
        const colaboradores = [
            { id: 'zooplus', nombre: 'Zooplus' },
            { id: 'xunta', nombre: 'Xunta de Galicia' },
            { id: 'kiwoko', nombre: 'Kiwoko' },
            { id: 'tiendanimal', nombre: 'Tiendanimal' }
        ];

        const counterBody = document.getElementById('counter-body');
        const resetButton = document.getElementById('reset-counter');

        function getCounterData() {
            return JSON.parse(localStorage.getItem(contadorKey) || '{}');
        }

        function renderCounter() {
            const data = getCounterData();
            counterBody.innerHTML = colaboradores
                .map((colaborador) => `
                    <tr>
                        <td>${colaborador.nombre}</td>
                        <td>${data[colaborador.id] || 0}</td>
                    </tr>
                `)
                .join('');
        }

        resetButton.addEventListener('click', () => {
            localStorage.removeItem(contadorKey);
            renderCounter();
        });

        renderCounter();
    </script>
</body>
</html>

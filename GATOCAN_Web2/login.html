<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | GatoCan Natura Rural</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="auth-page">
    <main class="auth-wrapper">
        <section class="auth-card">
            <a href="./index.html" class="back-link">← Volver al inicio</a>
            <h1>Iniciar sesión</h1>
            <p class="auth-subtitle">Accede con correo/contraseña o usando tu cuenta de Google.</p>

            <form id="loginForm" class="auth-form" novalidate>
                <label for="loginUser">Correo electrónico</label>
                <input id="loginUser" name="usuario" type="email" required>

                <label for="loginPass">Contraseña</label>
                <input id="loginPass" name="password" type="password" required>

                <button type="submit" class="btn btn-primary auth-submit">Entrar</button>
            </form>

            <button id="googleLogin" type="button" class="btn google-btn">Iniciar sesión con Google</button>

            <p id="loginMessage" class="auth-message" aria-live="polite"></p>
            <p class="auth-helper">Acceso conectado a Supabase (usa tu correo electrónico).</p>
            <p class="auth-helper">¿Aún no tienes cuenta? <a href="./register.html">Regístrate aquí</a>.</p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="./auth.js"></script>
</body>
</html>

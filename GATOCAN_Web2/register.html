<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | GatoCan Natura Rural</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="auth-page">
    <main class="auth-wrapper">
        <section class="auth-card">
            <a href="./index.html" class="back-link">← Volver al inicio</a>
            <h1>Crear cuenta</h1>
            <p class="auth-subtitle">Regístrate para participar y colaborar con la asociación.</p>

            <form id="registerForm" class="auth-form" novalidate>
                <label for="fullName">Nombre completo</label>
                <input id="fullName" name="nombre" type="text" required>

                <label for="email">Correo electrónico</label>
                <input id="email" name="email" type="email" required>

                <label for="regUser">Usuario</label>
                <input id="regUser" name="usuario" type="text" required>

                <label for="regPass">Contraseña</label>
                <input id="regPass" name="password" type="password" minlength="6" required>

                <label for="confirmPass">Confirmar contraseña</label>
                <input id="confirmPass" name="confirmar" type="password" minlength="6" required>

                <button type="submit" class="btn btn-primary auth-submit">Registrarme</button>
            </form>

            <button id="googleRegister" type="button" class="btn google-btn">Registrarse con Google</button>
            <p id="registerMessage" class="auth-message" aria-live="polite"></p>
            <p class="auth-helper">¿Ya tienes cuenta? <a href="./login.html">Inicia sesión aquí</a>.</p>
        </section>
    </main>

    <script src="./auth.js"></script>
</body>
</html>
